name: Deploy Pocket Finance to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check and build
        run: pnpm build
      - name: Generate and validate PWA PNG icons
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate-pwa-icons.py
      - name: Verify deployed PWA manifest assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          dist = Path("dist")
          manifest = json.loads((dist / "manifest.webmanifest").read_text())
          for icon in manifest["icons"]:
              path = dist / icon["src"].rsplit("/", 1)[-1]
              assert path.is_file(), f"Missing manifest icon: {path}"
              if icon["type"] == "image/png":
                  with Image.open(path) as image:
                      declared = icon["sizes"]
                      actual = f"{image.width}x{image.height}"
                      assert declared == actual, f"{path}: manifest says {declared}, actual {actual}"
          print("Manifest JSON and all declared icon files are valid.")
          PY
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
